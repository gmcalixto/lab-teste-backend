
name: Testes Automatizados FastAPI

# Eventos que iniciam o workflow
on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  # Permite execução manual pelo GitHub
  workflow_dispatch:

jobs:
  testes:
    name: Executar testes Pytest
    runs-on: ubuntu-latest

    steps:
      # 1. Obtém os arquivos do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o ambiente Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # 3. Instala as dependências
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Executa os testes locais
      # O SQLite temporário é criado pelas fixtures
      - name: Executar testes FastAPI
        run: |
          python -m pytest tests/test_main.py \
            -v \
            --tb=short \
            --html=relatorio_testes.html \
            --self-contained-html

      # 5. Armazena o relatório HTML
      # Executa mesmo quando algum teste falha
      - name: Publicar relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-pytest
          path: relatorio_testes.html
          if-no-files-found: warn
